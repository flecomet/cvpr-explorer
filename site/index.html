<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVPR 2026 Explorer — SPECTER2 Semantic Map</title>
<meta name="description" content="A 2D semantic map of all CVPR 2026 papers, built from SPECTER2 embeddings.">
<script src="https://cdn.plot.ly/plotly-gl2d-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #111; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid #2a2a2a;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 small { color: #888; font-weight: 400; }
  #search {
    flex: 1 1 220px; max-width: 380px; padding: 7px 10px;
    background: #1c1c1c; color: #eee; border: 1px solid #3a3a3a; border-radius: 6px;
    font-size: 14px;
  }
  #search:focus { outline: none; border-color: #6ea8fe; }
  #hits { color: #888; font-size: 13px; min-width: 90px; }
  header a { color: #9ab; font-size: 13px; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  main { display: flex; flex-wrap: wrap; }
  #plot { flex: 1 1 620px; height: calc(100vh - 130px); min-height: 420px; }
  #panel {
    flex: 0 1 380px; max-height: calc(100vh - 130px); overflow-y: auto;
    padding: 16px; border-left: 1px solid #2a2a2a; font-size: 14px; line-height: 1.5;
  }
  #panel h2 { font-size: 16px; margin: 0 0 8px; }
  #panel .authors { color: #9a9a9a; font-size: 13px; margin-bottom: 12px; }
  #panel .abstract { color: #ccc; }
  #panel a.pdf {
    display: inline-block; margin-bottom: 12px; padding: 6px 12px;
    background: #2b6cb0; color: #fff; border-radius: 6px; text-decoration: none; font-size: 13px;
  }
  #panel .hint { color: #777; }
  footer { padding: 10px 16px; color: #777; font-size: 12px; border-top: 1px solid #2a2a2a; }
  footer a { color: #9ab; }
  @media (max-width: 800px) {
    #plot { height: 60vh; }
    #panel { border-left: none; border-top: 1px solid #2a2a2a; max-height: none; }
  }
</style>
</head>
<body>
<header>
  <h1>CVPR 2026 Explorer <small>— SPECTER2 semantic map</small></h1>
  <input id="search" type="search" placeholder="Search titles &amp; abstracts…" autocomplete="off" disabled>
  <span id="hits"></span>
  <a href="https://github.com/flecomet/cvpr-explorer" target="_blank" rel="noopener">GitHub</a>
</header>
<main>
  <div id="plot"></div>
  <aside id="panel"><p class="hint">Loading 4000+ papers…</p></aside>
</main>
<footer>
  Fork of <a href="https://github.com/dataplayer12/cvpr-explorer" target="_blank" rel="noopener">dataplayer12/cvpr-explorer</a>.
  Nearby points are semantically similar papers. Click a point for details.
</footer>

<script>
const panel = document.getElementById("panel");
const search = document.getElementById("search");
const hits = document.getElementById("hits");
let D = null, traces = null, haystack = null;

// Golden-angle hue rotation: distinct colors for an arbitrary cluster count.
function clusterColor(i) {
  return "hsl(" + ((i * 137.508) % 360).toFixed(1) + ",65%,60%)";
}

function buildTraces(data) {
  const byCluster = new Map();
  data.c.forEach((cid, i) => {
    if (!byCluster.has(cid)) byCluster.set(cid, []);
    byCluster.get(cid).push(i);
  });
  // -1 ("unclustered") first so it renders underneath everything else.
  const ids = [...byCluster.keys()].sort((a, b) => (a === -1 ? -1 : b === -1 ? 1 : a - b));
  return ids.map((cid, n) => ({
    type: "scattergl",
    mode: "markers",
    // Labels are "term · term · term"; the first two keep the legend narrow.
    name: data.clusters[String(cid)].split(" · ").slice(0, 2).join(" · "),
    x: byCluster.get(cid).map(i => data.x[i]),
    y: byCluster.get(cid).map(i => data.y[i]),
    text: byCluster.get(cid).map(i => data.title[i]),
    customdata: byCluster.get(cid),
    marker: { size: 6, color: cid === -1 ? "#666" : clusterColor(n) },
    hovertemplate: "<b>%{text}</b><extra></extra>",
  }));
}

const LAYOUT = {
  margin: { l: 40, r: 20, b: 40, t: 20 },
  paper_bgcolor: "#111", plot_bgcolor: "#111",
  font: { color: "#eee" },
  xaxis: { showgrid: false, zeroline: false, showticklabels: false },
  // scaleanchor keeps the map's true aspect ratio: distance means the same on both axes.
  yaxis: { showgrid: false, zeroline: false, showticklabels: false, scaleanchor: "x" },
  legend: { font: { size: 10 }, itemsizing: "constant", itemwidth: 30 },
  dragmode: "pan",
  hovermode: "closest",
};

function showPaper(i) {
  panel.innerHTML = "";
  const h2 = document.createElement("h2");
  h2.textContent = D.title[i];
  const au = document.createElement("p");
  au.className = "authors";
  au.textContent = D.authors[i];
  const a = document.createElement("a");
  a.className = "pdf";
  a.href = D.pdf[i];
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Open PDF";
  const ab = document.createElement("p");
  ab.className = "abstract";
  ab.textContent = D.abstract[i];
  panel.append(h2, au, a, ab);
  panel.scrollTop = 0;
}

// Search dims non-matching points instead of hiding them, so the map keeps its shape.
function applySearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    Plotly.restyle("plot", { "marker.opacity": 1, selectedpoints: [null] });
    hits.textContent = "";
    return;
  }
  let n = 0;
  const selected = traces.map(t => {
    const sel = [];
    t.customdata.forEach((i, k) => { if (haystack[i].includes(q)) { sel.push(k); n++; } });
    return sel;
  });
  Plotly.restyle("plot", { selectedpoints: selected, "marker.opacity": 1 });
  Plotly.restyle("plot", {
    "selected.marker.opacity": 1,
    "unselected.marker.opacity": 0.06,
  });
  hits.textContent = n + " match" + (n === 1 ? "" : "es");
}

fetch("data.json").then(r => r.json()).then(data => {
  D = data;
  traces = buildTraces(data);
  haystack = data.title.map((t, i) => (t + " " + data.abstract[i]).toLowerCase());
  Plotly.newPlot("plot", traces, LAYOUT, {
    responsive: true, displaylogo: false, scrollZoom: true,
    modeBarButtonsToRemove: ["select2d", "lasso2d", "toggleSpikelines"],
  });
  document.getElementById("plot").on("plotly_click", e => showPaper(e.points[0].customdata));
  panel.innerHTML = '<p class="hint">A 2D semantic map of all ' + data.x.length +
    " CVPR 2026 papers, built from SPECTER2 embeddings.<br><br>" +
    "Click any point to read its title, authors and abstract, and to open the PDF. " +
    "Scroll to zoom, drag to pan.</p>";
  search.disabled = false;
  let timer;
  search.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      applySearch(search.value);
      // Keep the URL shareable without adding history entries per keystroke.
      const url = new URL(location);
      if (search.value.trim()) url.searchParams.set("q", search.value);
      else url.searchParams.delete("q");
      history.replaceState(null, "", url);
    }, 150);
  });

  const q = new URLSearchParams(location.search).get("q");
  if (q) { search.value = q; applySearch(q); }
}).catch(err => {
  panel.innerHTML = '<p class="hint">Failed to load data.json: ' + err + "</p>";
});
</script>
</body>
</html>
